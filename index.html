<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Matrix Day Planner</title>
    
    <!-- PWA Settings for Fullscreen Android App -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
            position: fixed;
        }

        /* Matrix Rain Canvas Background */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.45;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            background: transparent !important;
        }

        /* Desktop Mode: Frosted Glass Panel */
        @media (min-width: 768px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .app-container {
                width: 92vw;
                max-width: 1100px;
                height: 88vh;
                border-radius: 12px;
                background: rgba(18, 18, 18, 0.45) !important;
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
                overflow: hidden;
            }
        }

        /* Sidebar Drawer */
        .sidebar {
            width: 280px;
            background: rgba(12, 12, 12, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        @media (max-width: 767px) {
            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 82%;
                max-width: 300px;
                transform: translateX(-100%);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.9);
            }
            .sidebar.open {
                transform: translateX(0);
            }
        }

        /* Mobile Header */
        .mobile-header {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: transparent;
            z-index: 5;
        }

        @media (max-width: 767px) {
            .mobile-header {
                display: flex;
            }
        }

        .menu-toggle {
            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .btn-red {
            background-color: #cc0000;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .btn-red:active {
            background-color: #ee0000;
        }

        .item-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-card {
            background: rgba(40, 40, 40, 0.4);
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .list-card.active {
            border-color: #cc0000;
            background: rgba(60, 60, 60, 0.6);
        }

        .card-title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-preview {
            font-size: 12px;
            color: #aaaaaa;
        }

        /* Workspace Main Panel */
        .workspace-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        @media (max-width: 767px) {
            .main-content {
                background: rgba(15, 15, 15, 0.45) !important;
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-top-left-radius: 16px;
                border-top-right-radius: 16px;
                border-top: 1px solid rgba(255, 255, 255, 0.12);
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
            }
        }

        @media (min-width: 768px) {
            .main-content {
                background: transparent;
            }
        }

        .header-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-green {
            background-color: #1b8a51;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
        }

        .input-title {
            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            font-weight: bold;
            outline: none;
            margin-bottom: 16px;
            width: 100%;
        }

        .input-title::placeholder {
            color: #666666;
        }

        .task-input-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .task-input-bar input {
            flex: 1;
            background: rgba(24, 24, 24, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .task-input-bar input:focus {
            border-color: #cc0000;
        }

        .btn-add {
            background: rgba(42, 42, 42, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .tasks-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            display: flex;
            align-items: center;
            background: rgba(25, 25, 25, 0.4);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #666666;
        }

        .task-checkbox {
            margin-right: 12px;
            accent-color: #cc0000;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-text {
            flex: 1;
            font-size: 14px;
            word-break: break-word;
        }

        .btn-delete-item {
            background: transparent;
            border: none;
            color: #666666;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9;
        }

        .overlay.active {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>
    <div class="overlay" id="overlay"></div>

    <div class="app-container">
        <!-- Sidebar Navigation Drawer -->
        <div class="sidebar" id="sidebar">
            <button class="btn-red" id="newLogBtn">+ New Day Plan</button>
            <div class="item-list" id="logList"></div>
        </div>

        <div class="workspace-wrapper">
            <!-- Mobile Header Top Bar -->
            <div class="mobile-header">
                <button class="menu-toggle" id="menuToggle">&#9776;</button>
                <span style="font-weight: bold; font-size: 15px;">Matrix Planner</span>
            </div>

            <!-- Main Content Area -->
            <div class="main-content">
                <div class="header-actions">
                    <button class="btn-green" id="saveBtn">Save</button>
                    <button class="btn-red" id="deleteBtn" style="width: auto; padding: 8px 16px;">Delete</button>
                </div>
                
                <input type="text" id="planTitle" class="input-title" placeholder="Title (e.g., Daily Goals)" />
                
                <div class="task-input-bar">
                    <input type="text" id="taskInput" placeholder="Add a task or goal..." />
                    <button class="btn-add" id="addTaskBtn">Add</button>
                </div>

                <div class="tasks-container" id="tasksContainer"></div>
            </div>
        </div>
    </div>

    <script>
        /* Matrix Digital Rain Animation */
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const alphabet = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ' + 
            'アカサタナハマヤラワガザダバパイキシチニヒミリギジヂビピウクスツヌフムユルグズブヅプエケセテネヘメレゲゼデベペオコソトノホモヨロヲゴゾドボポ';

        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let rainDrops = Array(columns).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff'; 
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        /* App Logic */
        let plans = JSON.parse(localStorage.getItem('matrix_plans_v3')) || [
            {
                id: Date.now(),
                title: "Daily Plan - " + new Date().toLocaleDateString(),
                tasks: [
                    { id: 1, text: "Welcome to Matrix Day Planner", completed: false },
                    { id: 2, text: "Tap tasks to cross them out", completed: true }
                ]
            }
        ];
        let activePlanId = plans[0]?.id || null;

        const logListEl = document.getElementById('logList');
        const planTitleInput = document.getElementById('planTitle');
        const tasksContainer = document.getElementById('tasksContainer');
        const taskInput = document.getElementById('taskInput');
        const newLogBtn = document.getElementById('newLogBtn');
        const saveBtn = document.getElementById('saveBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menuToggle');
        const overlay = document.getElementById('overlay');

        function toggleMobileMenu() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        menuToggle.onclick = toggleMobileMenu;
        overlay.onclick = toggleMobileMenu;

        function saveToStorage() {
            localStorage.setItem('matrix_plans_v3', JSON.stringify(plans));
        }

        function renderSidebar() {
            logListEl.innerHTML = '';
            plans.forEach(plan => {
                const card = document.createElement('div');
                card.className = `list-card ${plan.id === activePlanId ? 'active' : ''}`;
                card.onclick = () => {
                    selectPlan(plan.id);
                    if (window.innerWidth < 768) toggleMobileMenu();
                };

                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = plan.title || 'Untitled Plan';

                const preview = document.createElement('div');
                preview.className = 'card-preview';
                preview.textContent = `${plan.tasks.length} item(s)`;

                card.appendChild(title);
                card.appendChild(preview);
                logListEl.appendChild(card);
            });
        }

        function renderActivePlan() {
            const currentPlan = plans.find(p => p.id === activePlanId);
            if (!currentPlan) {
                planTitleInput.value = '';
                tasksContainer.innerHTML = '';
                return;
            }

            planTitleInput.value = currentPlan.title;
            tasksContainer.innerHTML = '';

            currentPlan.tasks.forEach(task => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `task-item ${task.completed ? 'completed' : ''}`;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'task-checkbox';
                checkbox.checked = task.completed;
                checkbox.onchange = () => toggleTask(task.id);

                const label = document.createElement('span');
                label.className = 'task-text';
                label.textContent = task.text;

                const deleteBtnItem = document.createElement('button');
                deleteBtnItem.className = 'btn-delete-item';
                deleteBtnItem.textContent = '\u2715';
                deleteBtnItem.onclick = () => deleteTask(task.id);

                itemDiv.appendChild(checkbox);
                itemDiv.appendChild(label);
                itemDiv.appendChild(deleteBtnItem);
                tasksContainer.appendChild(itemDiv);
            });
        }

        function selectPlan(id) {
            activePlanId = id;
            renderSidebar();
            renderActivePlan();
        }

        function createNewPlan() {
            const newPlan = {
                id: Date.now(),
                title: 'New Daily Plan',
                tasks: []
            };
            plans.unshift(newPlan);
            activePlanId = newPlan.id;
            saveToStorage();
            renderSidebar();
            renderActivePlan();
            if (window.innerWidth < 768 && sidebar.classList.contains('open')) toggleMobileMenu();
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            const currentPlan = plans.find(p => p.id === activePlanId);
            if (currentPlan) {
                currentPlan.tasks.push({
                    id: Date.now(),
                    text: text,
                    completed: false
                });
                taskInput.value = '';
                saveToStorage();
                renderActivePlan();
                renderSidebar();
            }
        }

        function toggleTask(taskId) {
            const currentPlan = plans.find(p => p.id === activePlanId);
            if (currentPlan) {
                const task = currentPlan.tasks.find(t => t.id === taskId);
                if (task) {
                    task.completed = !task.completed;
                    saveToStorage();
                    renderActivePlan();
                }
            }
        }

        function deleteTask(taskId) {
            const currentPlan = plans.find(p => p.id === activePlanId);
            if (currentPlan) {
                currentPlan.tasks = currentPlan.tasks.filter(t => t.id !== taskId);
                saveToStorage();
                renderActivePlan();
                renderSidebar();
            }
        }

        newLogBtn.onclick = createNewPlan;

        saveBtn.onclick = () => {
            const currentPlan = plans.find(p => p.id === activePlanId);
            if (currentPlan) {
                currentPlan.title = planTitleInput.value;
                saveToStorage();
                renderSidebar();
            }
        };

        deleteBtn.onclick = () => {
            plans = plans.filter(p => p.id !== activePlanId);
            activePlanId = plans[0]?.id || null;
            saveToStorage();
            renderSidebar();
            renderActivePlan();
        };

        addTaskBtn.onclick = addTask;
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        planTitleInput.addEventListener('input', () => {
            const currentPlan = plans.find(p => p.id === activePlanId);
            if (currentPlan) {
                currentPlan.title = planTitleInput.value;
                saveToStorage();
                renderSidebar();
            }
        });

        renderSidebar();
        renderActivePlan();
    </script>
</body>
</html>
